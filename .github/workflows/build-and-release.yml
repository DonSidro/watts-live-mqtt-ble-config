name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller bleak paho-mqtt ttkbootstrap

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed watts_live_gui.py --hidden-import=ttkbootstrap --hidden-import=ttkbootstrap.constants

      - name: Rename binary
        run: |
          mkdir output
          move dist\watts_live_gui.exe output\WattsLiveConfig-Windows.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WattsLiveConfig-Windows
          path: output/*

  build-macos:
    name: Build on macOS (Apple Silicon)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "pyinstaller>=6.0" bleak paho-mqtt ttkbootstrap

      - name: Verify Tk is available
        run: |
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build .app bundle
        run: |
          pyinstaller --noconfirm watts_live_gui.spec

      - name: Zip bundle
        run: |
          mkdir output
          ditto -c -k --keepParent dist/WattsLiveConfig.app output/WattsLiveConfig-macOS-arm64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WattsLiveConfig-macOS
          path: output/*

  release:
    name: Create GitHub Release
    needs: [build, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
